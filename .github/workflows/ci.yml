name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dco:
    name: dco
    # Pull requests only: GitHub's synthetic merge commits (and squash merges pasted
    # by the web UI) carry no trailer, so push-side checking produced a permanent red
    # (R4 adversarial P2); the gate belongs where the author can still amend.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every PR commit must carry Signed-off-by (DCO)
        run: |
          range="${{ github.event.pull_request.base.sha }}..HEAD"
          fail=0
          for sha in $(git rev-list --no-merges $range); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' $sha | grep -q .; then
              echo "commit $sha is missing Signed-off-by (use: git commit -s)"; fail=1
            fi
          done
          exit $fail

  # DESIGN §9: 按 Boot 版 × 模块拆 job；静态单例容器 + fork=1 + fast/slow 分层 + 套件 ≤20min。
  # ubuntu runner 自带 Docker，slow 层（@Tag("slow") 的 Testcontainers 用例）随 verify 全量执行。
  test:
    name: verify (${{ matrix.boot }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        boot: [boot40, boot41]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Full gate: fast + slow layers, coverage checks (core >=90%, modules >=85%),
      # ArchUnit rules. The containers profile re-enables the tenantkit-test coverage gate.
      - name: Verify (dual-version matrix)
        run: ./mvnw --no-transfer-progress verify -P${{ matrix.boot }} -Pcontainers

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.boot }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # Release packaging DoD (DESIGN §9): javadoc + sources jars per module, doclint on.
  # Central upload itself happens in release.yml on tags and requires the owner-side
  # GPG/Central credentials (docs/ops/central-release-checklist.md).
  packaging:
    name: release packaging
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package with javadoc/sources (doclint on)
        run: ./mvnw --no-transfer-progress -Prelease package -DskipTests
